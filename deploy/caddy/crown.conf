# Crown — Caddy (копировать в /etc/caddy/sites/crown.conf)
# DNS: crown.skykraft.su → этот сервер (wildcard *.skykraft.su)
# sudo caddy validate --config /etc/caddy/Caddyfile
# sudo systemctl reload caddy

crown.skykraft.su {
    request_body {
        max_size 55MB
    }

    reverse_proxy 127.0.0.1:8090 {
        transport http {
            dial_timeout 30s
            read_timeout 180s
            write_timeout 180s
            response_header_timeout 180s
            keepalive_interval 30s
            keepalive_idle_conns 100
        }
    }

    log {
        output stdout
        format console
    }
}
